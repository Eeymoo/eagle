name: Build Android APK

on:
  push:
    branches: [release]   # 只有推送到 release 分支才出包（快照分支）
  workflow_dispatch:

permissions:
  contents: write   # required to create snapshot releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: .
        run: pnpm -r --if-present run typecheck

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          echo "::group::Gradle Build"
          ./gradlew assembleRelease \
            -x lint \
            -Pkotlin.incremental=true \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g"
          echo "::endgroup::"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eagle-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Release snapshot
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ github.run_number }}
          name: Snapshot #${{ github.run_number }}
          body: |
            自动快照构建（release 分支 @ ${{ github.sha }})
            - GlitchTip 崩溃上报已内置
            - 产物: APK (arm64/armv7/x86/x86_64 通用)
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
          make_latest: false

      - name: Summary
        run: |
          APK=$(ls ../android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "## 📦 Eagle APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: \`$APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- 下载: Actions 页面 → 本次运行 → Artifacts → eagle-apk" >> $GITHUB_STEP_SUMMARY
