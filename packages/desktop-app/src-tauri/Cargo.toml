[package]
name = "eagle-desktop"
version = "0.1.0"
description = "Eagle 直播桌面端"
edition = "2021"

[lib]
name = "eagle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
